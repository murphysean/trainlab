[workspace]
resolver = "2"
members = [
    "crates/trainlab-core",
    "crates/trainlab-inject",
    "crates/trainlab-gui",
    "crates/trainlab-scanner",
    "crates/trainlab-cave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/murphysean/trainlab"
authors = ["Sean Murphy <murphysean84@gmail.com>"]

[workspace.dependencies]
# Shared protocol / serialization
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_yaml = "0.9"
# Async runtime for IPC
tokio = { version = "1", features = ["full"] }
# MCP (Model Context Protocol) server
rmcp = { version = "3.0", features = [
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "client",
] }
axum = "0.8"
# Cross-platform process memory access
# (we'll implement our own thin wrapper in trainlab-core)
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# GUI
eframe = "0.27"
egui = "0.27"
# Disassembler (for the disassemble / addr_to_module tools)
iced-x86 = "1"

[profile.release]
opt-level = 3
lto = true
