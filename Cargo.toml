[workspace]
resolver = "2"
members = [
    "crates/trainlab-core",
    "crates/trainlab-inject",
    "crates/trainlab-gui",
    "crates/trainlab-scanner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/murphysean/trainlab"

[workspace.dependencies]
# Shared protocol / serialization
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# Async runtime for IPC
tokio = { version = "1", features = ["full"] }
# Cross-platform process memory access
# (we'll implement our own thin wrapper in trainlab-core)
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# GUI
eframe = "0.27"
egui = "0.27"

[profile.release]
opt-level = 3
lto = true
